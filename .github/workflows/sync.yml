name: Nightly Data Sync

on:
  schedule:
    # Runs every night at midnight UTC (7pm ET / 8pm CT)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r data-sync/requirements.txt

      - name: Run Drive sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_CLIENTS_FOLDER_ID: ${{ secrets.DRIVE_CLIENTS_FOLDER_ID }}
          DRIVE_META_FILE_ID: ${{ secrets.DRIVE_META_FILE_ID }}
        run: python data-sync/sync_drive.py

      - name: Run Gong sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GONG_ACCESS_KEY: ${{ secrets.GONG_ACCESS_KEY }}
          GONG_ACCESS_SECRET: ${{ secrets.GONG_ACCESS_SECRET }}
        run: python data-sync/sync_gong.py
