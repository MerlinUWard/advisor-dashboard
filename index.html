<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disciplined — Dashboard</title>
<script>
(function(){var m=document.cookie.match(/(?:^|;\s*)theme=([^;]+)/);if(m)document.documentElement.setAttribute('data-theme',m[1]);})();
</script>
<style>
/* ── THEME TOKENS ─────────────────────────────────────────────────────────── */
:root{
  --bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F8FAFC;--surface-3:#F1F5F9;
  --border:#E2E8F0;--border-light:#F1F5F9;
  --text-1:#0F172A;--text-2:#64748B;--text-3:#94A3B8;
  --muted-bg:#FAFAFA;--today-bg:#FFFBEB;--today-amber:#B45309;
  --shadow-sm:0 2px 8px rgba(15,23,42,.06);
  --shadow-md:0 4px 16px rgba(15,23,42,.1);
  --shadow-lg:0 20px 60px rgba(15,23,42,.2);
}
[data-theme="dark"]{
  --bg:#0D0F1F;--surface:#161829;--surface-2:#1D2038;--surface-3:#252849;
  --border:#2D3260;--border-light:#1D2038;
  --text-1:#EEF0FF;--text-2:#9198C8;--text-3:#525880;
  --muted-bg:#161829;--today-bg:#1F1600;--today-amber:#F59E0B;
  --shadow-sm:0 2px 14px rgba(0,0,0,.5);
  --shadow-md:0 4px 24px rgba(0,0,0,.6);
  --shadow-lg:0 20px 64px rgba(0,0,0,.75);
  /* jewel accent overrides */
  --jewel-ops:#3B4FD8;--jewel-fin:#0F7A5A;--jewel-mkt:#6D28D9;
}
/* ── BASE ─────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text-1);min-height:100vh;transition:background .25s,color .2s;}
.rainbow{height:4px;width:100%;background:linear-gradient(90deg,#6366F1 0%,#8B5CF6 15%,#EC4899 30%,#F59E0B 50%,#10B981 70%,#3B82F6 85%,#6366F1 100%);position:fixed;top:0;left:0;right:0;z-index:200;}
.wrap{max-width:1280px;margin:0 auto;padding:28px 32px 60px;}
h1{font-size:28px;font-weight:800;color:var(--text-1);}
.sub{font-size:14px;color:var(--text-3);margin-top:4px;}
.sec-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);}
.divider{height:1px;background:var(--border-light);margin:14px 0;}
/* ── BADGES ───────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.badge-ops{background:#DBEAFE;color:#1D4ED8;}
.badge-fin{background:#D1FAE5;color:#065F46;}
.badge-mkt{background:#EDE9FE;color:#5B21B6;}
.badge-pos{background:#D1FAE5;color:#065F46;}
.badge-neu{background:#DBEAFE;color:#1D4ED8;}
.badge-cau{background:#FEF3C7;color:#92400E;}
.badge-neg{background:#FEE2E2;color:#991B1B;}
.badge-nodata{background:var(--surface-3);color:var(--text-2);}
/* ── BUTTONS ──────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;}
.btn:hover{opacity:.85;}
.btn-primary{background:#3B82F6;color:#fff;}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border);}
.btn-danger{background:#FEE2E2;color:#991B1B;}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px;}
/* ── FORMS ────────────────────────────────────────────────────────────────── */
input,textarea,select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit;outline:none;background:var(--surface-2);color:var(--text-1);transition:border-color .15s;}
input:focus,textarea:focus,select:focus{border-color:#3B82F6;}
label{font-size:13px;font-weight:600;color:var(--text-1);display:block;margin-bottom:6px;}
.form-group{margin-bottom:16px;}
/* ── MODAL ────────────────────────────────────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(5,7,20,.55);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:480px;box-shadow:var(--shadow-lg);color:var(--text-1);}
.modal-title{font-size:18px;font-weight:800;margin-bottom:20px;color:var(--text-1);}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.toast{position:fixed;top:20px;right:20px;z-index:9999;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.2);opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.toast-ok{background:#059669;}
.toast-err{background:#DC2626;}
.toast-warn{background:#D97706;}
.btn.saving{opacity:.6;pointer-events:none;}
.btn.saving::after{content:'';display:inline-block;width:12px;height:12px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;margin-left:8px;vertical-align:middle;animation:spin .5s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none!important;}
/* ── NAV ──────────────────────────────────────────────────────────────────── */
.nav{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.nav-back{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2);border:none;background:none;padding:6px 10px;border-radius:8px;}
.nav-back:hover{background:var(--surface-3);color:var(--text-1);}
/* ── DARK TOGGLE ──────────────────────────────────────────────────────────── */
.theme-toggle{background:var(--surface-2);border:1px solid var(--border);color:var(--text-1);border-radius:10px;padding:7px 12px;font-size:16px;cursor:pointer;transition:background .2s,border-color .2s;line-height:1;display:flex;align-items:center;gap:6px;}
.theme-toggle:hover{background:var(--surface-3);}
.theme-toggle-label{font-size:12px;font-weight:600;color:var(--text-2);}
/* ── TEAM VIEW ────────────────────────────────────────────────────────────── */
.moi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 20px;}
.moi-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;background:var(--muted-bg);border:1px solid var(--border-light);cursor:pointer;transition:background .15s;}
.moi-row:hover{background:var(--surface-3);}
.moi-col{display:flex;flex-direction:column;gap:6px;}
.today-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.advisor-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;}
.upcoming-table{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
.upcoming-header{display:grid;grid-template-columns:90px 160px 180px 1fr;padding:10px 20px;background:var(--surface-2);border-bottom:1px solid var(--border);}
.upcoming-row{display:grid;grid-template-columns:90px 160px 180px 1fr;padding:11px 20px;border-bottom:1px solid var(--border-light);cursor:pointer;transition:background .1s;}
.upcoming-row:last-child{border-bottom:none;}
.upcoming-row:hover{background:var(--surface-2);}
.upcoming-row.today-row{background:var(--today-bg);}
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.client-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .15s,transform .1s,border-color .2s;}
.client-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
.client-card.urgent{border-color:#FCD34D;}
[data-theme="dark"] .client-card.urgent{border-color:#92610A;}
/* dark jewel badges */
[data-theme="dark"] .badge-ops{background:#1E2B6A;color:#7B8FFF;}
[data-theme="dark"] .badge-fin{background:#0B3B2A;color:#34D399;}
[data-theme="dark"] .badge-mkt{background:#2D1B5E;color:#C084FC;}
[data-theme="dark"] .badge-pos{background:#0B3B2A;color:#34D399;}
[data-theme="dark"] .badge-neu{background:#1E2B6A;color:#7B8FFF;}
[data-theme="dark"] .badge-cau{background:#3A2400;color:#FCD34D;}
[data-theme="dark"] .badge-neg{background:#3B0D0D;color:#F87171;}
/* ── CLIENT VIEW ──────────────────────────────────────────────────────────── */
.client-hero{margin-bottom:32px;}
.proj-list{display:flex;flex-direction:column;gap:12px;}
.proj-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);}
.proj-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;user-select:none;transition:background .1s;}
.proj-header:hover{background:var(--muted-bg);}
.proj-header-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.proj-name{font-size:15px;font-weight:700;color:var(--text-1);}
.proj-expand-icon{font-size:16px;transition:transform .2s;flex-shrink:0;color:var(--text-3);}
.proj-body{border-top:1px solid var(--border-light);padding:0 18px 14px;}
.task-list{margin-top:10px;display:flex;flex-direction:column;gap:4px;}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;transition:background .1s;}
.task-row:hover{background:var(--surface-2);}
.task-cb{width:16px;height:16px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
.task-cb.done{background:#10B981;border-color:#10B981;color:#fff;}
.task-title{font-size:13px;color:var(--text-1);flex:1;line-height:1.4;}
.task-title.done{text-decoration:line-through;color:var(--text-3);}
.task-due{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;flex-shrink:0;}
.task-due.overdue{background:#FEE2E2;color:#991B1B;}
.task-due.today{background:#FEF3C7;color:#92400E;}
.task-due.upcoming{background:#DBEAFE;color:#1D4ED8;}
.task-due.future{background:var(--surface-3);color:var(--text-2);}
.task-due.no-date{background:#FEE2E2;color:#991B1B;}
.task-row.no-date-row{background:#FFF5F5;border-radius:8px;padding:6px 8px;margin:0 -8px;}
/* ── MOI CHART PANELS */
.chart-panel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px;}
.chart-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 20px 14px;box-shadow:var(--shadow-sm);}
.chart-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.chart-panel-title{font-size:13px;font-weight:700;color:var(--text-1);}
.chart-empty{height:120px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border-radius:10px;color:var(--text-3);font-size:12px;text-align:center;line-height:1.6;padding:12px;}
/* ── CALL SUMMARY MODAL */
.call-modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.65);z-index:600;display:flex;align-items:center;justify-content:center;padding:24px;}
.call-modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.call-modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 14px;border-bottom:1px solid var(--border-light);}
.call-modal-title{font-size:17px;font-weight:800;color:var(--text-1);}
.call-modal-body{padding:20px 24px;}
.scorecard-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border-light);}
.scorecard-row:last-child{border-bottom:none;}
.score-chip{font-size:20px;font-weight:800;width:34px;flex-shrink:0;text-align:center;line-height:1.2;}
.scorecard-cat{font-size:12px;font-weight:700;color:var(--text-1);margin-bottom:2px;}
.scorecard-rat{font-size:12px;color:var(--text-2);line-height:1.5;}
.reflection-q{font-size:13px;font-weight:700;color:var(--text-1);margin-bottom:4px;}
.reflection-a{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:14px;}
/* ── CHART TOOLTIP */
#chart-tooltip{position:fixed;background:rgba(15,23,42,.88);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;pointer-events:none;white-space:nowrap;z-index:700;display:none;}
/* ── DARK OVERRIDES for new elements */
[data-theme="dark"] .task-row.no-date-row{background:#2D1010;}
[data-theme="dark"] .call-modal-bg{background:rgba(0,0,0,.75);}
.task-actions{display:flex;gap:4px;flex-shrink:0;}
.icon-btn{background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;font-size:14px;color:var(--text-3);transition:color .15s,background .15s;}
.icon-btn:hover{color:var(--text-1);background:var(--surface-3);}
.empty-state{text-align:center;padding:20px;color:var(--text-3);font-size:13px;}
/* ── INLINE STYLE DARK OVERRIDES ──────────────────────────────────────────── */
/* Covers dynamically injected style attributes from JS template strings */
[data-theme="dark"] [style*="color:#0F172A"]{color:var(--text-1)!important;}
[data-theme="dark"] [style*="color:#64748B"]{color:var(--text-2)!important;}
[data-theme="dark"] [style*="color:#94A3B8"]{color:var(--text-3)!important;}
[data-theme="dark"] [style*="color:#374151"]{color:var(--text-1)!important;}
[data-theme="dark"] [style*="background:#fff"],[data-theme="dark"] [style*="background:#FFFFFF"]{background:var(--surface)!important;}
[data-theme="dark"] [style*="background:#F8FAFC"]{background:var(--surface-2)!important;}
[data-theme="dark"] [style*="background:#FAFAFA"]{background:var(--muted-bg)!important;}
[data-theme="dark"] [style*="background:#F1F5F9"]{background:var(--surface-3)!important;}
[data-theme="dark"] [style*="border:1px solid #E2E8F0"]{border-color:var(--border)!important;}
[data-theme="dark"] [style*="border-bottom:1px solid #E2E8F0"]{border-bottom-color:var(--border)!important;}
[data-theme="dark"] [style*="border-bottom:1px solid #F1F5F9"]{border-bottom-color:var(--border-light)!important;}
[data-theme="dark"] [style*="border-top:1px solid #F1F5F9"]{border-top-color:var(--border-light)!important;}
[data-theme="dark"] [style*="color:#B45309"]{color:var(--today-amber)!important;}
[data-theme="dark"] [style*="background:#FFFBEB"]{background:var(--today-bg)!important;}
[data-theme="dark"] p[style*="color"]{color:var(--text-2)!important;}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div id="app" style="padding-top:4px;"></div>

<div id="modal" class="modal-bg hidden"></div>

<!-- Call summary modal container -->
<div id="call-modal-container" class="hidden"></div>

<div id="chart-tooltip"></div>

<script>
// ─── SUPABASE CONFIG (replace placeholders after Supabase project is created) ──
const SUPABASE_URL = 'https://tmszsjmscxdvtaeztaqh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtc3pzam1zY3hkdnRhZXp0YXFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxODY3NTQsImV4cCI6MjA5MDc2Mjc1NH0.8Y1y4fZUVVIqm8fRYAN1t_MNbRaWFHXJgR3aDsyexaQ';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── ID GENERATORS ────────────────────────────────────────────────────────────
var _nextId = 1000;
function tid(){ return 't-'+(++_nextId)+'-'+Math.random().toString(36).slice(2,6); }
function pid(){ return 'p-'+(++_nextId)+'-'+Math.random().toString(36).slice(2,6); }

// ─── STATE ────────────────────────────────────────────────────────────────────
let CLIENTS = [];
let _syncMeta = { gong: null, drive: null };
let _state = {view:'team', clientSlug:null, projIdx:null, expandedProjs:new Set()};

// ─── DATA LOADING ─────────────────────────────────────────────────────────────
async function loadData(){
  const [cRes, pRes, tRes, sRes, csRes] = await Promise.all([
    sb.from('clients').select('*').order('name'),
    sb.from('projects').select('*').order('sort_order'),
    sb.from('tasks').select('*').order('sort_order'),
    sb.from('sync_state').select('last_gong_sync,last_moi_sync').eq('id','singleton').single(),
    sb.from('advisor_call_summaries').select('*').order('call_date',{ascending:true}),
  ]);

  const projects = pRes.data || [];
  const tasks    = tRes.data || [];
  const callSums = csRes.data || [];

  // Group call summaries by client_id → role
  const csMap = {};
  callSums.forEach(r => {
    if(!csMap[r.client_id]) csMap[r.client_id] = {operations:[],finance:[],marketing:[]};
    if(csMap[r.client_id][r.role]) csMap[r.client_id][r.role].push(r);
  });

  CLIENTS = (cRes.data || []).map(c => ({
    slug: c.id,
    name: c.name,
    moi:  c.moi_score != null ? {score: c.moi_score} : null,
    callSummaries: csMap[c.id] || {operations:[],finance:[],marketing:[]},
    projects: projects
      .filter(p => p.client_id === c.id)
      .map(p => ({
        id:     p.id,
        name:   p.name,
        status: p.status,
        adv:    p.adv,
        tasks:  tasks
          .filter(t => t.project_id === p.id)
          .map(t => ({
            id:        t.id,
            title:     t.title,
            due_date:  t.due_date || null,
            completed: t.completed,
            adv:       t.adv,
          }))
      }))
  }));

  const syncRow = sRes.data || {};
  _syncMeta.gong  = syncRow.last_gong_sync || null;
  _syncMeta.drive = syncRow.last_moi_sync  || null;

  render();
}

function fmtSync(ts){
  if(!ts) return 'Never';
  const d = new Date(ts);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function moiBadge(score){
  if(score===null||score===undefined) return '<span class="badge badge-nodata">No Data</span>';
  if(score>=4) return `<span class="badge badge-pos">Positive · ${score}</span>`;
  if(score===3) return `<span class="badge badge-neu">Neutral · ${score}</span>`;
  if(score===2) return `<span class="badge badge-cau">Cautious · ${score}</span>`;
  return `<span class="badge badge-neg">Negative · ${score}</span>`;
}

function advBadge(adv){
  if(adv==='O') return '<span class="badge badge-ops" style="font-size:10px;padding:2px 8px;">OPS</span>';
  if(adv==='F') return '<span class="badge badge-fin" style="font-size:10px;padding:2px 8px;">FIN</span>';
  if(adv==='M') return '<span class="badge badge-mkt" style="font-size:10px;padding:2px 8px;">MKTG</span>';
  return '';
}

const TODAY = new Date().toISOString().slice(0,10);
const IN7   = new Date(Date.now()+7*864e5).toISOString().slice(0,10);

function dueBadge(d){
  if(!d) return '<span class="task-due no-date">NO DATE</span>';
  const ds = d.slice(0,10);
  if(ds<TODAY) return `<span class="task-due overdue">Overdue</span>`;
  if(ds===TODAY) return `<span class="task-due today">Today ⚡</span>`;
  if(ds<=IN7) return `<span class="task-due upcoming">${fmtDate(ds)}</span>`;
  return `<span class="task-due future">${fmtDate(ds)}</span>`;
}

function fmtDate(d){
  if(!d) return '';
  const [y,m,day] = d.slice(0,10).split('-');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[+m-1]} ${+day}`;
}

function getClient(slug){ return CLIENTS.find(c=>c.slug===slug); }

function upcomingTasks(){
  const rows=[];
  CLIENTS.forEach(c=>{
    c.projects.forEach((p,pi)=>{
      p.tasks.filter(t=>!t.completed&&t.due_date&&t.due_date.slice(0,10)<=IN7).forEach(t=>{
        rows.push({clientName:c.name,clientSlug:c.slug,projIdx:pi,projName:p.name,taskTitle:t.title,due:t.due_date.slice(0,10),adv:t.adv||p.adv||''});
      });
    });
  });
  rows.sort((a,b)=>a.due<b.due?-1:1);
  return rows;
}

function clientNextDue(c){
  let best=null,task=null;
  c.projects.forEach(p=>{
    p.tasks.filter(t=>!t.completed&&t.due_date).forEach(t=>{
      const ds=t.due_date.slice(0,10);
      if(!best||ds<best){best=ds;task=t.title;}
    });
  });
  return {date:best,task};
}

// ─── ROUTER ──────────────────────────────────────────────────────────────────
function toggleTheme(){
  const h=document.documentElement;
  const t=h.getAttribute('data-theme')==='dark'?'light':'dark';
  h.setAttribute('data-theme',t);
  document.cookie='theme='+t+';max-age=31536000;path=/';
  _syncThemeButtons();
}
function _syncThemeButtons(){
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  document.querySelectorAll('#theme-icon').forEach(el=>el.textContent=isDark?'☀️':'🌙');
  document.querySelectorAll('#theme-label').forEach(el=>el.textContent=isDark?'Light':'Dark');
}

// ─── MOI CHART HELPERS ───────────────────────────────────────────────────────
const ROLE_COLOR = {operations:'#3B82F6', finance:'#10B981', marketing:'#8B5CF6'};
const ROLE_LABEL = {operations:'Operations', finance:'Finance', marketing:'Marketing'};

function buildMOIChart(entries, role){
  const color = ROLE_COLOR[role];
  const cutoff = new Date(Date.now()-84*864e5).toISOString().slice(0,10);
  const pts = (entries||[])
    .filter(e => e.call_date >= cutoff && e.moi_score != null)
    .sort((a,b) => a.call_date < b.call_date ? -1 : 1);
  if(!pts.length) return '<div class="chart-empty">No scored calls<br>in the last 12 weeks</div>';
  const W=380,H=185,pL=28,pR=12,pT=10,pB=30;
  const cW=W-pL-pR, cH=H-pT-pB;
  const minD=pts[0].call_date, maxD=pts[pts.length-1].call_date;
  const span=Math.max(new Date(maxD)-new Date(minD),1);
  function xp(d){return pts.length===1 ? pL+cW/2 : pL+(new Date(d)-new Date(minD))/span*cW;}
  function yp(s){return pT+cH-((s-1)/5)*cH;}
  const grids=[1,2,3,4,5,6].map(s=>{
    const y=yp(s);
    return `<line x1="${pL}" y1="${y.toFixed(1)}" x2="${W-pR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,3"/>`+
           `<text x="${pL-4}" y="${(y+3).toFixed(1)}" font-size="8" fill="var(--text-3)" text-anchor="end">${s}</text>`;
  }).join('');
  const coords=pts.map(e=>({x:xp(e.call_date),y:yp(e.moi_score),e}));
  const poly=coords.length>1
    ? `<polyline points="${coords.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
    : '';
  const dots=coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2" style="cursor:pointer" `+
    `onmouseenter="showChartTip(event,'${fmtDate(c.e.call_date)} · ${c.e.moi_score}')" onmouseleave="hideChartTip()" `+
    `onclick="showCallSummary('${role}','${c.e.call_date}')"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">${grids}${poly}${dots}</svg>`;
}

function renderCallCharts(c){
  const roles=['operations','finance','marketing'];
  const panels=roles.map(role=>{
    const entries=(c.callSummaries&&c.callSummaries[role])||[];
    const badge=role==='operations'?'badge-ops':role==='finance'?'badge-fin':'badge-mkt';
    const recent=entries.filter(e=>e.moi_score!=null).slice(-1)[0];
    const safeJson=JSON.stringify(entries).replace(/<\//g,'<\\/');
    const sentimentBg=recent?.sentiment==='positive'?'#D1FAE5':recent?.sentiment==='neutral'?'#DBEAFE':recent?.sentiment==='cautious'?'#FEF3C7':'#FEE2E2';
    const sentimentClr=recent?.sentiment==='positive'?'#065F46':recent?.sentiment==='neutral'?'#1E40AF':recent?.sentiment==='cautious'?'#92400E':'#991B1B';
    return `<div class="chart-panel">`+
      `<div class="chart-panel-header">`+
        `<span class="chart-panel-title">${ROLE_LABEL[role]}</span>`+
        (recent?`<span class="badge ${badge}" style="font-size:10px;">${recent.moi_score}</span>`:'')+
      `</div>`+
      buildMOIChart(entries, role)+
      (recent?`<div style="border-top:1px solid var(--border);padding:8px 12px;">`+
        `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">`+
          `<span style="font-size:11px;font-weight:600;color:var(--text-1);">${fmtDate(recent.call_date)}</span>`+
          (recent.sentiment?`<span style="font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;background:${sentimentBg};color:${sentimentClr};text-transform:capitalize;">${recent.sentiment}</span>`:'')+
        `</div>`+
        (recent.summary?`<div style="font-size:12px;color:var(--text-3);line-height:1.5;">${esc(recent.summary)}</div>`:'')+
      `</div>`:'')+
      `<script id="callData-${role}-${c.slug}" type="application/json">${safeJson}<\/script>`+
    `</div>`;
  }).join('');
  return `<div style="margin-bottom:28px;">`+
    `<div class="sec-label">MOI CALL SCORES — LAST 12 WEEKS</div>`+
    `<div class="chart-panel-grid">${panels}</div>`+
  `</div>`;
}

function showCallSummary(role, callDate){
  const slug=_state.clientSlug;
  const scriptEl=document.getElementById('callData-'+role+'-'+slug);
  if(!scriptEl) return;
  let entries;
  try{ entries=JSON.parse(scriptEl.textContent||'[]'); } catch(e){ return; }
  const entry=entries.find(e=>e.call_date===callDate);
  if(!entry) return;
  const d=entry.call_summary_detail||{};
  const scorecard=(d.moi_scorecard||[]).map(row=>{
    const s=row.score||0;
    const clr=s>=4?'#10B981':s>=3?'#3B82F6':s>=2?'#F59E0B':'#EF4444';
    return `<div class="scorecard-row"><div class="score-chip" style="color:${clr};">${s}</div>`+
      `<div><div class="scorecard-cat">${esc(row.category)}</div><div class="scorecard-rat">${esc(row.rationale)}</div></div></div>`;
  }).join('');
  const refs=(d.reflection_questions||[]).map(q=>
    `<div class="reflection-q">${esc(q.question)}</div><div class="reflection-a">${esc(q.answer)}</div>`
  ).join('');
  const cvals=(d.core_values||[]).map(v=>
    `<span style="background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;margin-right:6px;margin-bottom:4px;display:inline-block;">${esc(v)}</span>`
  ).join('');
  const modal=document.getElementById('call-modal-container');
  modal.innerHTML=`<div class="call-modal-bg" onclick="if(event.target===this)closeCallSummary()">`+
    `<div class="call-modal">`+
      `<div class="call-modal-header">`+
        `<div>`+
          `<div class="call-modal-title">${ROLE_LABEL[role]} Call — ${fmtDate(callDate)}</div>`+
        `</div>`+
        `<button onclick="closeCallSummary()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-3);padding:4px;line-height:1;flex-shrink:0;">×</button>`+
      `</div>`+
      `<div class="call-modal-body">`+
        (d.strategic_summary?`<div style="margin-bottom:20px;"><div class="sec-label" style="margin-bottom:8px;">STRATEGIC SUMMARY</div><p style="font-size:13px;color:var(--text-2);line-height:1.6;">${esc(d.strategic_summary)}</p></div>`:'')+
        (scorecard?`<div style="margin-bottom:20px;"><div class="sec-label" style="margin-bottom:8px;">MOI SCORECARD</div>${scorecard}</div>`:'')+
        (refs?`<div style="margin-bottom:20px;"><div class="sec-label" style="margin-bottom:8px;">REFLECTION</div>${refs}</div>`:'')+
        (cvals?`<div><div class="sec-label" style="margin-bottom:8px;">CORE VALUES</div><div style="display:flex;flex-wrap:wrap;gap:4px;">${cvals}</div></div>`:'')+
      `</div>`+
    `</div>`+
  `</div>`;
  modal.classList.remove('hidden');
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────────────
// ─── ADVISOR FILTER (UPCOMING TABLE) ─────────────────────────────────────────
function _readAdvFilterCookie(){
  const m=document.cookie.match(/(?:^|;\s*)advFilter=([^;]+)/);
  return m?JSON.parse(decodeURIComponent(m[1])):null;
}
function _writeAdvFilterCookie(checked){
  document.cookie='advFilter='+encodeURIComponent(JSON.stringify(checked))+';max-age=31536000;path=/';
}
function _applyAdvFilter(){
  const checkboxIds=['af-O','af-F','af-M','af-'];
  const checked=checkboxIds.map(id=>{const el=document.getElementById(id);return el&&el.checked?id.replace('af-',''):null;}).filter(v=>v!==null);
  const allChecked=checked.length===0||checked.length===4;
  const rows=document.querySelectorAll('#upcoming-table .upcoming-row[data-adv]');
  let visible=0;
  rows.forEach(row=>{
    const adv=row.getAttribute('data-adv')||'';
    const show=allChecked||checked.includes(adv);
    row.style.display=show?'':'none';
    if(show) visible++;
  });
  const label=document.getElementById('upcoming-label');
  if(label) label.textContent='UPCOMING — NEXT 7 DAYS ('+(allChecked?rows.length:visible)+' of '+rows.length+' tasks)';
  const btnLabel=document.getElementById('adv-filter-label');
  if(btnLabel) btnLabel.textContent=allChecked?'Advisor: All':'Advisor: '+checked.map(a=>a==='O'?'OPS':a==='F'?'FIN':a==='M'?'MKTG':'Unassigned').join(', ');
}
function _onAdvFilterChange(){
  const checked=['O','F','M',''].filter(a=>{const el=document.getElementById('af-'+(a));return el&&el.checked;});
  _writeAdvFilterCookie(checked);
  _applyAdvFilter();
}
function _initAdvFilter(){
  const saved=_readAdvFilterCookie();
  if(saved&&saved.length>0&&saved.length<4){
    saved.forEach(a=>{const el=document.getElementById('af-'+a);if(el)el.checked=true;});
  }
  _applyAdvFilter();
}
function _toggleAdvFilter(e){
  e.stopPropagation();
  const dd=document.getElementById('adv-filter-dropdown');
  if(!dd) return;
  const isOpen=dd.style.display!=='none';
  dd.style.display=isOpen?'none':'block';
  if(!isOpen){
    const close=function(ev){if(!document.getElementById('adv-filter-btn').contains(ev.target)&&!dd.contains(ev.target)){dd.style.display='none';document.removeEventListener('click',close);}};
    setTimeout(()=>document.addEventListener('click',close),0);
  }
}

function render(){
  const app=document.getElementById('app');
  if(_state.view==='team') app.innerHTML=renderTeam();
  else if(_state.view==='client') app.innerHTML=renderClient();
  _syncThemeButtons();
  if(_state.view==='team') _initAdvFilter();
  if(_state.projIdx!==null){
    setTimeout(()=>{
      const el=document.querySelector('.focused');
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    },100);
  }
}

// ─── INTERACTIONS ─────────────────────────────────────────────────────────────
function toggleProj(pi){
  if(_state.expandedProjs.has(pi)) _state.expandedProjs.delete(pi);
  else _state.expandedProjs.add(pi);
  render();
}

async function toggleTask(slug,pi,ti){
  const t=getClient(slug).projects[pi].tasks[ti];
  const next=!t.completed;
  const {error}=await sb.from('tasks').update({completed:next}).eq('id',t.id);
  if(error){ toast('Failed to update task','err'); return; }
  t.completed=next;
  render();
}

// ─── MODAL HELPERS ───────────────────────────────────────────────────────────
let _modalOpen = false;
function showModal(html){ _modalOpen=true; const m=document.getElementById('modal');m.classList.remove('hidden');m.innerHTML=html; }
function closeModal(){ _modalOpen=false; document.getElementById('modal').classList.add('hidden'); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── TOAST & SAVE HELPERS ────────────────────────────────────────────────────
let _toastTimer=null;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast toast-'+type+' show';
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'), type==='err'?5000:2500);
}
function setBtnSaving(label){
  const btns=document.querySelectorAll('.modal-footer .btn-primary, .modal-footer .btn-danger');
  btns.forEach(b=>{b.classList.add('saving'); b.textContent=label||'Saving';});
}
function clearBtnSaving(){
  const btns=document.querySelectorAll('.modal-footer .btn-primary, .modal-footer .btn-danger');
  btns.forEach(b=>b.classList.remove('saving'));
}

// ─── ADD PROJECT ─────────────────────────────────────────────────────────────
function addProject(slug){
  showModal(`<div class="modal">
    <div class="modal-title">Add Project</div>
    <div class="form-group"><label>Project Name</label><input id="pn" placeholder="e.g. HubSpot CRM Implementation" /></div>
    <div class="form-group"><label>Advisor</label>
      <select id="pa">
        <option value="">Unassigned</option>
        <option value="O">Ops — Merlin Ward</option>
        <option value="F">Finance — Mike Jensen</option>
        <option value="M">Marketing — Justin Cook</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAddProject('${slug}')">Add Project</button>
    </div>
  </div>`);
  setTimeout(()=>document.getElementById('pn').focus(),50);
}
async function saveAddProject(slug){
  const name=document.getElementById('pn').value.trim();
  const adv=document.getElementById('pa').value||null;
  if(!name) return alert('Please enter a project name.');
  setBtnSaving('Adding…');
  const c=getClient(slug);
  const newId=pid();
  const pi=c.projects.length;
  const {error}=await sb.from('projects').insert({id:newId,client_id:slug,name,status:'active',adv,sort_order:pi});
  if(error){ clearBtnSaving(); toast('Failed to add project: '+error.message,'err'); return; }
  c.projects.push({id:newId,name,status:'active',adv,tasks:[]});
  _state.expandedProjs.add(pi);
  closeModal(); render();
  toast('Project added');
}

// ─── EDIT PROJECT ────────────────────────────────────────────────────────────
function editProject(slug,pi){
  const p=getClient(slug).projects[pi];
  showModal(`<div class="modal">
    <div class="modal-title">Edit Project</div>
    <div class="form-group"><label>Project Name</label><input id="pn" value="${esc(p.name)}" /></div>

      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditProject('${slug}',${pi})">Save</button>
    </div>
  </div>`);
}
async function saveEditProject(slug,pi){
  const name=document.getElementById('pn').value.trim();
  const adv=document.getElementById('pa').value||null;
  if(!name) return alert('Please enter a project name.');
  setBtnSaving();
  const p=getClient(slug).projects[pi];

// ─── DELETE PROJECT ──────────────────────────────────────────────────────────
function deleteProject(slug,pi){
  const p=getClient(slug).projects[pi];
  showModal(`<div class="modal">
    <div class="modal-title">Delete Project</div>
    <p style="font-size:14px;color:#64748B;margin-bottom:8px;">Delete <strong>${esc(p.name)}</strong> and all its tasks?</p>
    <p style="font-size:13px;color:#94A3B8;">This cannot be undone.</p>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDeleteProject('${slug}',${pi})">Delete</button>
    </div>
  </div>`);
}
async function confirmDeleteProject(slug,pi){
  setBtnSaving('Deleting…');
  const c=getClient(slug);
  const p=c.projects[pi];
  const {error}=await sb.from('projects').delete().eq('id',p.id);
  if(error){ clearBtnSaving(); toast('Failed to delete project: '+error.message,'err'); return; }
  c.projects.splice(pi,1);
  _state.expandedProjs.clear(); _state.projIdx=null;
  closeModal(); render();
  toast('Project deleted');
}

// ─── ADD TASK ────────────────────────────────────────────────────────────────
function addTask(slug,pi){

    <div class="form-group"><label>Task Title</label><textarea id="tt" rows="2" placeholder="Describe the task…"></textarea></div>
    <div class="form-group"><label>Due Date (optional)</label><input id="td" type="date" /></div>
    <div class="form-group"><label>Advisor</label><select id="ta">
      <option value="" ${a===''?'selected':''}>Unassigned</option>
      <option value="O" ${a==='O'?'selected':''}>Ops — Merlin Ward</option>
      <option value="F" ${a==='F'?'selected':''}>Finance — Mike Jensen</option>

async function saveAddTask(slug,pi){
  const title=document.getElementById('tt').value.trim();

  toast('Task added');

// Close modal on backdrop click
document.getElementById('modal').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

// ─── REAL-TIME SUBSCRIPTION ──────────────────────────────────────────────────
function onRealtimeChange(){
  if(_modalOpen){
    toast('Data updated by another user — close and re-open your edit','warn');
  } else {
    loadData();
  }
}
sb.channel('dashboard-live')
  .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},    ()=>onRealtimeChange())
  .on('postgres_changes',{event:'*',schema:'public',table:'projects'}, ()=>onRealtimeChange())
  .on('postgres_changes',{event:'*',schema:'public',table:'clients'},  ()=>onRealtimeChange())
  .subscribe();

// ─── INIT ────────────────────────────────────────────────────────────────────
document.getElementById('app').innerHTML = renderLoading();
loadData();
</script>
